name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (留空则默认读取 build.gradle.kts 版本，如 v0.9.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate release metadata
        run: |
          ACTUAL_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && ( "$TAG" == "main" || -z "$TAG" ) ]]; then
            TAG="v$ACTUAL_VERSION"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
            || { echo "❌ 非法版本标签：$TAG"; exit 1; }
          EXPECTED_VERSION="${TAG#v}"
          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] \
            || { echo "❌ tag=$EXPECTED_VERSION，但 versionName=$ACTUAL_VERSION"; exit 1; }
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "✅ release metadata: tag=$TAG, versionName=$ACTUAL_VERSION"

      # mosh native 产物（GPLv3 二进制不入库）——发布包必须自行构建，否则 APK 缺 libmosh-client.so，
      # 选 mosh 协议会因缺 native 库而不可用。见 scripts/build-mosh-native.sh。
      - name: Install NDK r29
        run: sdkmanager --install "ndk;29.0.14206865"

      - name: Build mosh native (arm64-v8a)
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/29.0.14206865"
          [ -d "$NDK_DIR" ] || NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/29.* 2>/dev/null | sort -V | tail -1)"
          [ -d "$NDK_DIR" ] || NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          echo "Using NDK: $NDK_DIR"
          export ANDROID_NDK="$NDK_DIR"
          bash scripts/build-mosh-native.sh arm64-v8a
          ls -lh app/src/main/jniLibs/arm64-v8a/


      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/moke-release.jks"
            echo "✅ 签名证书已解码到 runner 临时目录"
          else
            echo "⚠️ 未配置 SIGNING_KEYSTORE_B64 Secret，将跳过证书解码"
          fi

      - name: Assemble release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -s "$RUNNER_TEMP/moke-release.jks" ]; then
            export MOKE_KEYSTORE="$RUNNER_TEMP/moke-release.jks"
            export MOKE_KEYSTORE_PASSWORD="$SIGNING_KEYSTORE_PASSWORD"
            export MOKE_KEY_ALIAS="$SIGNING_KEY_ALIAS"
            export MOKE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
            echo "🔑 使用配置的发布证书进行签名"
          else
            echo "⚠️ 使用内置 Debug 签名回退打包 Release APK（如需正式分发签名，可在 GitHub 仓库 Secrets 中配置）"
          fi
          ./gradlew assembleRelease --stacktrace

      # 守卫：确保 mosh native 库已打进 APK，避免再次发出「选 mosh 即崩」的包。
      - name: Verify native libs packaged
        run: |
          for APK in app/build/outputs/apk/standard/release/app-standard-release.apk \
                     app/build/outputs/apk/maple/release/app-maple-release.apk; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/libmosh-client.so" || { echo "❌ $APK 缺 libmosh-client.so"; exit 1; }
            unzip -l "$APK" | grep -q "lib/arm64-v8a/libtermux.so" || { echo "❌ $APK 缺 libtermux.so"; exit 1; }
          done
          # Both variants must contain the same bundled Maple Mono NF CN font (>15 MB).
          for APK in app/build/outputs/apk/standard/release/app-standard-release.apk \
                     app/build/outputs/apk/maple/release/app-maple-release.apk; do
            unzip -l "$APK" | awk '/\.ttf$/ && $1+0 > 15000000 {f=1} END{exit !f}' \
              || { echo "❌ $APK 缺内置 Maple 字体"; exit 1; }
          done
          echo "✅ 两个变体 native 库与 Maple 字体已打包"

      - name: Stage APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/moke-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/maple/release/app-maple-release.apk "dist/moke-${RELEASE_TAG}-maple.apk"
          ls -lh dist/

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${RELEASE_TAG}"; VER="${TAG#v}"
          # 抽出 CHANGELOG.md 里 "## [x.y.z]" 到下一个 "## [" 之间的内容；抽不到就留空（下游回退到静态说明）。
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/section.md || true
          if [ -s /tmp/section.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
          { echo 'body<<CHANGELOG_EOF'; cat /tmp/section.md; echo 'CHANGELOG_EOF'; } >> "$GITHUB_OUTPUT"
          echo "--- 提取结果 ---"; cat /tmp/section.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: moke ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          # SemVer 后缀（如 -rc.1）只发布为 GitHub Pre-release，且绝不占用 Latest。
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
          generate_release_notes: true
          files: dist/moke-*.apk
          body: |
            **moke · 墨客 ${{ env.RELEASE_TAG }}** — Android 原生 SSH / mosh 终端。

            ${{ steps.changelog.outputs.body }}

            ### 安装（两个包择一）
            - `moke-${{ env.RELEASE_TAG }}.apk` / `moke-${{ env.RELEASE_TAG }}-maple.apk` — 两包均内置 Maple Mono NF CN；保留两个名称以兼容旧版本升级。

            允许"安装未知来源应用"后安装（稳定签名，可覆盖升级）。

            ### 特性
            - 多会话，原生终端渲染（Apache-2.0 terminal-view 内核）
            - SSH（密码 / 私钥）+ mosh（UDP 漫游）
            - 实时预览外观 · 多套配色 · 内置 Maple Mono NF CN
            - 连接分组排序 · 双排附加键 · 文本段输入

            本版改动见 [CHANGELOG](https://github.com/ddwwbb/moke/blob/main/CHANGELOG.md)。
